<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-labelledby="t">
  <title id="t">Placeholder proses — penggilingan</title>
  <desc>Placeholder artwork — grinder manual dengan pegangan krepis dan partikel kopi.</desc>
  
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0.7" y2="1">
