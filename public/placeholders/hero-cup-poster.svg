<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="t d">
  <title id="t">Cangkir kopi Smiljan</title>
  <desc id="d">Ilustrasi placeholder cangkir keramik dengan kopi, di atas cangkir wider dan dikelilingi biji kopi. Digunakan sebagai cadangan statis bila adegan 3D tidak dapat ditampilkan.</desc>

  <defs>
    <radialGradient id="bg" cx="0.42" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#F6EBD9" />
      <stop offset="0.45" stop-color="#E4D2B4" />
      <stop offset="1" stop-color="#C4A87F" />
    </radialGradient>
    <linearGradient id="cup" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFBF4" />
      <stop offset="0.4" stop-color="#F2E9D8" />
      <stop offset="0.78" stop-color="#DCCCAE" />
      <stop offset="1" stop-color="#B69E7C" />
    </linearGradient>
    <linearGradient id="saucer" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F4EADB" />
      <stop offset="1" stop-color="#C3AC8B" />
    </linearGradient>
    <radialGradient id="coffee" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#4A2A17" />
      <stop offset="0.6" stop-color="#2C160C" />
      <stop offset="1" stop-color="#180C06" />
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5A3828" stop-opacity="0.42" />
      <stop offset="1" stop-color="#5A3828" stop-opacity="0" />
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="steamBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <!-- Ground and light -->
  <rect width="900" height="900" fill="url(#bg)" />
  <ellipse cx="450" cy="700" rx="360" ry="120" fill="url(#shadow)" filter="url(#soft)" />

  <!-- Steam -->
  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.4"
    stroke-width="16"
    stroke-linecap="round"
    filter="url(#steamBlur)"
  >
    <path d="M388 262c-22-30 18-52 0-82" />
    <path d="M452 246c-24-32 20-56 0-88" />
    <path d="M516 262c-22-30 18-52 0-82" />
  </g>

  <!-- Saucer -->
  <ellipse cx="450" cy="648" rx="248" ry="52" fill="url(#saucer)" />
  <ellipse cx="450" cy="640" rx="248" ry="52" fill="url(#saucer)" />
  <ellipse cx="450" cy="638" rx="120" ry="26" fill="#A98F6D" opacity="0.35" />

  <!-- Handle (behind the body) -->
  <path
    d="M596 396c74 6 78 106-6 122"
    fill="none"
    stroke="#E4D4B8"
    stroke-width="30"
    stroke-linecap="round"
  />
  <path
    d="M596 396c74 6 78 106-6 122"
    fill="none"
    stroke="#FFFBF4"
    stroke-opacity="0.5"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Cup body -->
  <path
    d="M300 344c10 108 28 214 74 258 38 36 114 36 152 0 46-44 64-150 74-258z"
    fill="url(#cup)"
  />
  <!-- Sheen -->
  <path
    d="M330 366c8 96 24 186 62 226 14 15 32 22 50 24-34-24-52-96-58-250z"
    fill="url(#sheen)"
    opacity="0.5"
  />
  <!-- Base shading -->
  <path
    d="M392 594c14 6 34 10 58 10s44-4 58-10c-12 12-36 18-58 18s-46-6-58-18z"
    fill="#8C7454"
    opacity="0.28"
  />

  <!-- Rim + coffee surface -->
  <ellipse cx="450" cy="344" rx="150" ry="34" fill="#FFFBF4" />
  <ellipse cx="450" cy="346" rx="122" ry="25" fill="url(#coffee)" />
  <ellipse cx="450" cy="346" rx="122" ry="25" fill="none" stroke="#8A5528" stroke-width="7" opacity="0.75" />
  <ellipse cx="424" cy="339" rx="52" ry="10" fill="#C08A4E" opacity="0.22" />
  <ellipse cx="396" cy="352" rx="18" ry="5" fill="#E0B47A" opacity="0.3" />

  <!-- Beans on the saucer -->
  <g fill="#3B2114">
    <g transform="translate(196 668) rotate(-14)">
      <ellipse rx="30" ry="20" />
      <path d="M-20 3c10-9 30-9 40 0" fill="none" stroke="#180C06" stroke-width="5" stroke-linecap="round" />
    </g>
    <g transform="translate(300 700) rotate(10)">
      <ellipse rx="29" ry="19" />
      <path d="M-19 3c10-9 29-9 38 0" fill="none" stroke="#180C06" stroke-width="5" stroke-linecap="round" />
    </g>
    <g transform="translate(672 662) rotate(22)">
      <ellipse rx="31" ry="20" />
      <path d="M-20 3c10-9 30-9 40 0" fill="none" stroke="#180C06" stroke-width="5" stroke-linecap="round" />
    </g>
    <g transform="translate(596 706) rotate(-8)">
      <ellipse rx="28" ry="18" />
      <path d="M-18 3c9-8 28-8 37 0" fill="none" stroke="#180C06" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Film grain -->
  <rect width="900" height="900" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay" />
  <rect
    width="900"
    height="900"
    fill="none"
    stroke="#F2E9D8"
    stroke-opacity="0.2"
    stroke-width="2"
    x="26"
    y="26"
    width="848"
    height="848"
  />
</svg>
