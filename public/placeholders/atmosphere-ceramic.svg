<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="t">
  <title id="t">Placeholder suasana — keramik</title>
  <desc>Placeholder artwork — detail tekstur keramik dan garis bahan.</desc>
  
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3B2617"/>
      <stop offset="0.55" stop-color="#5A3828"/>
      <stop offset="1" stop-color="#241711"/>
    </linearGradient>
    <linearGradient id="light" x1="0.1" y1="0" x2="0.9" y2="1">
