      <stop offset="1" stop-color="#0D0705"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFE8C2" stop-opacity="0.6"/>
