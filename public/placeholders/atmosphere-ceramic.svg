      <stop offset="1" stop-color="#241711" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolDark" cx="0.55" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#E8CFA6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#241711" stop-opacity="0"/>
    </radialGradient>
